<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Cormac's Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Inline so it needs no extra request and no binary file in the repo. Gives the
       app window a real icon in the taskbar when opened via the desktop shortcut. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23000'/%3E%3Ctext x='32' y='45' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='34' font-weight='bold' fill='%23FFFDF2' text-anchor='middle'%3ECH%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topnav">
    <div class="brand">Cormac's Hub</div>
    <nav class="nav-tabs">
      <button class="nav-tab" data-view="home">Home</button>
      <button class="nav-tab" data-view="briefing">Briefing</button>
      <button class="nav-tab" data-view="clients">Clients</button>
    </nav>
    <!-- Always visible, on every page, so a running timer can't be forgotten about. -->
    <button class="nav-timer" id="nav-timer" hidden></button>
  </header>

  <main class="main" id="main"></main>

  <div class="modal-backdrop" id="add-client-backdrop">
    <form class="modal" id="add-client-form">
      <h2>New client</h2>
      <label>Name<input type="text" name="name" required autocomplete="off" /></label>
      <label>Contact<input type="text" name="contact" placeholder="email, phone..." autocomplete="off" /></label>
      <label>What you're building for them<textarea name="building" rows="2"></textarea></label>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="cancel-add-client">Cancel</button>
        <button type="submit" class="btn-primary">Create</button>
      </div>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
